# Experiment: Stronger Regularization
# Based on lecture: Higher weight decay reduces overfitting
#
# Changes from default:
# - weight_decay: 5e-4 (was 1e-4) - 5x stronger L2 regularization
#
# Expected: Lower training accuracy, better generalization

output_folder: "../logs"
model_type: "CNN"
dataset:
  root_folder: "../data"

opt:
  type: "SGD"
  momentum: 0.9
  weight_decay: 5e-4
  learning_rate: 0.1
  epochs: 60
  warmup: true
  warmup_epochs: 1
  schedule_type: "cosine"
